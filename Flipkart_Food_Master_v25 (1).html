<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flipkart Food — Bengaluru</title>
<style>
:root{
  --blue:#2874F0;--blue2:#0B4DB8;--navy:#002B84;--yellow:#FFE500;--coin:#FFC200;
  --bg:#F7F8FB;--card:#fff;--ink:#101114;--sub:#666C78;--muted:#9AA0AA;--line:#E8EAF0;
  --green:#0D9B6B;--soft:#EEF4FF;--shadow:0 8px 22px rgba(16,17,20,.07);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#11151c;font-family:var(--font);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}img,video,iframe{display:block}
#app{width:min(360px,calc(100vw - 20px));height:min(780px,calc(100vh - 20px));margin:10px auto;background:var(--bg);position:relative;overflow:hidden;border-radius:24px}
@media(min-width:650px){#app{width:360px;height:780px;margin:10px auto;border-radius:26px;border:5px solid #20242C;box-shadow:0 20px 56px rgba(0,0,0,.30)}}
.screen{height:100%;overflow:auto;padding-bottom:88px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}

/* TOP OF APP — intentionally kept unchanged */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#073B92,#002B84);color:#fff;padding:11px 13px 0}
.toprow{display:flex;align-items:center;gap:9px}.brand{font-weight:900;font-style:italic;font-size:18px}.brand span{color:var(--yellow)}
.loc{font-size:11px;flex:1;min-width:0}.loc b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loc small{color:rgba(255,255,255,.68)}
.coin{height:34px;padding:0 9px 0 5px;border-radius:999px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800}.coin img{width:23px;height:23px;border-radius:50%;object-fit:cover;display:block;background:#FFC200}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:10px;font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px}.tab{height:44px;border:0;background:transparent;color:rgba(255,255,255,.66);font-size:9.2px;line-height:1.05;font-weight:850;border-bottom:3px solid transparent;padding:0 3px}.tab.on{color:#fff;border-bottom-color:var(--yellow)}
.searchbar{height:46px;margin:10px 15px 0;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:9px;padding:0 12px;font-size:12px;color:var(--muted);box-shadow:0 2px 10px rgba(10,34,70,.06)}

/* ===== ONLY REDESIGNED AREA: PROMO / AD CAROUSEL ===== */
.promo{padding-top:13px}
.promorail{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:0 15px;scrollbar-width:none;scroll-padding:0 15px
}
.promorail::-webkit-scrollbar{display:none}
.banner{min-height:164px;
  width:calc(100% - 34px);min-width:calc(100% - 34px);height:178px;scroll-snap-align:start;
  border-radius:24px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  isolation:isolate
}
.banner:before{
  content:"";position:absolute;width:154px;height:154px;border-radius:50%;
  right:-70px;top:-72px;background:rgba(255,255,255,.075);z-index:-1
}
.banner:after{
  content:"";position:absolute;width:92px;height:92px;border-radius:50%;
  right:52px;bottom:-62px;background:rgba(255,255,255,.05);z-index:-1
}
.banner .kicker{
  font-size:9px;letter-spacing:.095em;text-transform:uppercase;font-weight:900;
  position:relative;z-index:2;display:flex;align-items:center;gap:5px
}
.banner .kicker .spark{font-size:9px;line-height:1}
.banner h2{
  font-size:22px;line-height:1.04;letter-spacing:-.7px;margin:5px 0 0;
  max-width:255px;position:relative;z-index:2
}
.banner p{
  font-size:10.8px;line-height:1.36;margin:7px 0 0;max-width:226px;
  position:relative;z-index:2
}
.banner .cta{
  position:absolute;left:18px;bottom:17px;height:37px;border:0;border-radius:999px;
  padding:0 15px;font-size:10.5px;font-weight:900;z-index:3
}
.banner .visual{position:absolute;right:16px;bottom:16px;z-index:2}

/* 1 — SuperCoins: dark flash-deal visual, but copy uses actual programme mechanics */
.b1{background:linear-gradient(135deg,#282B35 0%,#1A1C23 70%,#111318 100%);color:#fff}
.b1 .kicker{color:var(--yellow)}.b1 p{color:#D9DBE1}.b1 .cta{background:var(--coin);color:#4F3B00}
.coinart{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#FFF0A0 0,#FFC64A 34%,#FF9E42 70%,#F17B3B 100%);
  border:4px solid rgba(255,223,114,.5);box-shadow:0 8px 24px rgba(255,194,0,.24);
  position:relative
}
.coinart:before{
  content:"";position:absolute;inset:11px;border-radius:50%;border:3px solid rgba(157,91,0,.32)
}
.coinart:after{
  content:"SC";font-size:12px;font-weight:950;color:#8A5700;letter-spacing:-.3px
}

/* 2 — Planner: strong Flipkart blue + white CTA */
.b2{background:linear-gradient(135deg,#2B72EB 0%,#1651BE 55%,#093B99 100%);color:#fff}
.b2 .kicker{color:#CFE2FF}.b2 p{color:#E5EEFF}.b2 .cta{background:#fff;color:#0B4DB8}
.calendar{
  width:78px;height:70px;border-radius:17px;background:linear-gradient(180deg,#F9FBFF,#E8EDF8);
  padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.16);transform:rotate(1.5deg);position:relative
}
.calendar:before,.calendar:after{
  content:"";position:absolute;top:-5px;width:5px;height:12px;border-radius:4px;background:#C7D5F7;
  border:1px solid #7092D8
}
.calendar:before{left:16px}.calendar:after{right:16px}
.calendar .head{height:9px;background:#5579C8;border-radius:4px;margin:2px 0 8px}
.calendar .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.calendar .grid i{height:9px;border-radius:3px;background:#CED8EA}
.calendar .grid i:nth-child(3),.calendar .grid i:nth-child(6),.calendar .grid i:nth-child(10){background:#2874F0}

/* 3 — Tiffin: warm peach like the supplied reference */
.b3{background:linear-gradient(135deg,#FFF1E9 0%,#FFD8C7 72%,#FFCBB6 100%);color:#692B16}
.b3 .kicker{color:#B94F2B}.b3 p{color:#8B5038}.b3 .cta{background:#EC6540;color:#fff}
.tiffinart{
  width:78px;height:68px;border-radius:21px;background:rgba(255,255,255,.68);
  border:1px solid rgba(185,79,43,.13);display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(150,65,34,.10);position:relative
}
.tiffinart .plate{width:50px;height:50px;border-radius:50%;background:#F6A36B;border:5px solid #8A76A8;position:relative}
.tiffinart .plate:before{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#E9563C;left:8px;top:7px;box-shadow:18px 5px 0 #79B75A,8px 21px 0 #F1CF58}
.tiffinart .plate:after{content:"";position:absolute;width:23px;height:6px;border-radius:50%;background:#F8DDA7;left:9px;bottom:5px}

/* 4 — Bites: QSR proposition without repeating a speed claim */
.b4{background:linear-gradient(135deg,#2B72EF 0%,#1854C1 55%,#0A3E9E 100%);color:#fff}
.b4 .kicker{color:var(--yellow)}.b4 p{color:#E2EBFF}.b4 .cta{background:var(--yellow);color:var(--navy)}
.bite-logos{display:grid;grid-template-columns:repeat(3,31px);gap:6px}
.bite-logos img{
  width:31px;height:31px;border-radius:9px;background:#fff;padding:4px;object-fit:contain;
  border:1px solid rgba(255,255,255,.62);box-shadow:0 2px 5px rgba(0,0,0,.08)
}

/* 5 — Campus welcome: existing fifth card retained */
.b5{background:linear-gradient(135deg,#FFF8DC 0%,#FFE9A3 72%,#FFDB65 100%);color:#654B00}
.b5 .kicker{color:#8B6500}.b5 p{color:#78611C}.b5 .cta{background:#173D7A;color:#fff}
.studentart{
  width:76px;height:70px;border-radius:21px;background:rgba(255,255,255,.7);
  border:1px solid rgba(133,100,0,.10);display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(117,87,0,.08)
}
.studentart svg{width:43px;height:43px}
.dots{display:flex;justify-content:center;gap:5px;padding:8px 0 0}
.dots i{display:block;width:5px;height:5px;border-radius:50%;background:#D3D6DC;transition:.2s}
.dots i.on{width:17px;border-radius:5px;background:var(--blue)}

/* Everything below this point mirrors the existing consumer flow */
.chips{display:flex;gap:8px;overflow-x:auto;padding:13px 15px 1px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{height:39px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#5C626D;font-size:11.5px;font-weight:800;white-space:nowrap}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{padding:18px 15px 0}.sechead{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.eyebrow{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:900}.sechead h3{font-size:19px;letter-spacing:-.45px;margin:2px 0 0}.see{border:0;background:none;color:var(--blue);font-size:11.5px;font-weight:900}
.rail{display:flex;gap:10px;overflow:auto;margin:0 -15px;padding:0 15px 2px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.reel{width:144px;height:224px;flex:0 0 auto;border-radius:18px;overflow:hidden;position:relative;background:#111;box-shadow:var(--shadow)}.reel img,.reel video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.04) 60%)}.play{position:absolute;top:9px;right:9px;width:29px;height:29px;border-radius:50%;background:rgba(0,0,0,.44);display:grid;place-items:center;color:#fff;font-size:10px}.reelcopy{position:absolute;left:10px;right:10px;bottom:10px;color:#fff}.reelcopy b{font-size:12.5px;display:block}.reelcopy small{font-size:9.4px;color:rgba(255,255,255,.72)}
.bitesbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:#FFF8D8;color:#173D7A;border:1px solid #F1D65A;font-size:9px;font-weight:900;vertical-align:middle}.bitesbadge:before{content:"B";width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF6A0,#FFD319 65%,#F1B900);color:#003C95;font-size:8px}
.qcard{width:150px;flex:0 0 auto;background:#fff;border:1px solid #ECEEF2;border-radius:17px;overflow:hidden}.qpic{height:88px;position:relative}.qpic>img:first-child{width:100%;height:100%;object-fit:cover}.brandlogo{position:absolute;left:8px;bottom:7px;width:32px;height:32px;border-radius:9px;background:#fff;padding:4px;object-fit:contain;border:1px solid rgba(0,0,0,.08)}.qcopy{padding:9px 10px 11px}.qcopy b{font-size:12.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qcopy small{font-size:9.4px;color:var(--muted);display:block;margin-top:5px}
.restlist{display:grid;gap:10px}.restcard{display:flex;gap:10px;padding:10px;border:1px solid #ECEEF2;border-radius:18px;background:#fff}.restpic{width:96px;height:90px;border-radius:14px;overflow:hidden;position:relative;flex:0 0 auto}.restpic>img:first-child{width:100%;height:100%;object-fit:cover}.restcopy{flex:1;min-width:0;padding:2px 0}.restname{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10.3px;color:var(--sub);display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.rating{color:var(--green);font-weight:900}.price{font-size:11.3px;font-weight:850;margin-top:6px}
.pagehead{padding:16px 15px 0;display:flex;gap:10px;align-items:center}.pagehead h2{font-size:22px;margin:0}.pagehead small{font-size:9.8px;color:var(--muted);display:block;margin-top:2px}.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;font-size:22px}
.menuhero{margin:12px 15px 0;background:#fff;border:1px solid #ECEEF2;border-radius:19px;overflow:hidden}.menucover{height:146px;position:relative}.menucover>img:first-child{width:100%;height:100%;object-fit:cover}.menubrand{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:8px}.menubrand img{width:44px;height:44px;border-radius:10px;background:#fff;padding:4px;object-fit:contain}.menubrand span{background:rgba(255,255,255,.95);border-radius:12px;padding:7px 10px;font-size:11.5px;font-weight:900}.menumeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 11px 11px;font-size:9px;color:var(--sub)}
.seg{display:flex;gap:4px;margin:12px 15px 0;padding:4px;border-radius:13px;background:#EEF2F8}.seg button{height:41px;flex:1;border:0;border-radius:10px;background:transparent;color:#6E7480;font-size:11.5px;font-weight:900}.seg button.on{background:#fff;color:var(--blue2)}
.menuitems{padding:12px 15px 0;display:grid;gap:9px}.menuitem{display:flex;gap:10px;background:#fff;border:1px solid #ECEEF2;border-radius:16px;padding:10px}.itemcopy{flex:1}.itemcopy b{font-size:12px;display:block}.itemcopy small{font-size:9.3px;color:var(--muted)}.itemfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.add{height:36px;padding:0 15px;border:1.5px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-size:10px;font-weight:900}.itemimg{width:85px;height:78px;border-radius:12px;overflow:hidden}.itemimg img{width:100%;height:100%;object-fit:cover}
.planhero,.taste,.reward,.mini{margin:12px 15px 0;background:#fff;border:1px solid #ECEEF2;border-radius:18px;padding:14px}.planhero{background:linear-gradient(140deg,#EEF4FF,#FAFCFF);border-color:#DDE8FF}.planhero b,.taste b,.mini b{font-size:13px}.planhero p,.taste p,.mini small{font-size:9.6px;color:var(--sub);line-height:1.4}.mealToggle{display:flex;gap:4px;margin-top:10px;padding:4px;background:#fff;border:1px solid #E8ECF4;border-radius:12px}.mealToggle button{height:38px;flex:1;border:0;border-radius:9px;background:transparent;color:#737986;font-size:10.3px;font-weight:900}.mealToggle button.on{background:var(--navy);color:#fff}
.daystrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 15px 0}.day{background:#fff;border:1px solid #ECEEF2;border-radius:14px;padding:9px;text-align:center;font-size:10px}.day.on{background:#F4F7FF;border-color:#B7CFFF}
.planlist,.plans{padding:12px 15px 0;display:grid;gap:9px}.planmeal,.plancard{background:#fff;border:1px solid #ECEEF2;border-radius:16px;padding:11px}.planmeal b,.plancard b{font-size:11.8px}.planmeal small,.plancard small{display:block;font-size:9.2px;color:var(--muted);margin-top:3px}.planact{display:flex;gap:8px;margin-top:9px}.planact button{height:36px;flex:1;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;font-size:9.8px;font-weight:900}
.reward{background:linear-gradient(135deg,#111318,#282B33);color:#fff}.reward .big{font-size:29px;font-weight:900;color:var(--yellow)}
.bottom{position:absolute;left:0;right:0;bottom:0;height:68px;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid #E7E8EC;display:grid;grid-template-columns:repeat(5,1fr);z-index:50}.nav{border:0;background:none;color:#959BA6;font-size:9.3px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav .ico{font-size:19px}.nav.on{color:var(--blue)}.reelsnav{overflow:visible}.orb{width:42px;height:42px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#2874F0,#0B4DB8);color:#fff;border:3px solid #fff;box-shadow:0 7px 16px rgba(40,116,240,.3);margin-top:-22px;font-size:16px}
.overlay{position:absolute;inset:0;background:rgba(8,10,15,.46);z-index:70;display:none}.overlay.on{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;max-height:80%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:15px;transform:translateY(105%);transition:.2s}.sheet.on{transform:translateY(0)}.sheet h3{margin:0}.sheet p{font-size:10.5px;line-height:1.45;color:var(--sub)}.secondary,.primary{width:100%;height:44px;border-radius:12px;margin-top:9px;font-weight:900}.secondary{border:1px solid var(--line);background:#fff}.primary{border:0;background:var(--blue);color:#fff}
.player{position:absolute;inset:0;background:#050608;z-index:80;display:none;overflow:hidden}.player.on{display:block}.pclose{position:absolute;top:16px;left:14px;z-index:86;width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.54);color:#fff;font-size:16px}.reelfeed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}.reelfeed::-webkit-scrollbar{display:none}.reelpage{height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;background:#090A0D;overflow:hidden}.reelpage video,.reelpage .reelfallback{width:100%;height:100%;object-fit:cover}.reelpage .reelfallback{position:absolute;inset:0}.reelgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 30%,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}.reeltop{position:absolute;top:19px;left:68px;right:18px;z-index:83;color:#fff;font-size:12px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.reeltop .cartmini{background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.18);padding:7px 10px;border-radius:999px}.reelinfo{position:absolute;left:16px;right:72px;bottom:95px;z-index:83;color:#fff}.reelbrand{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:850;margin-bottom:7px}.reelbrand img{width:27px;height:27px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}.reelinfo h3{font-size:21px;line-height:1.05;margin:0 0 5px;letter-spacing:-.5px}.reelinfo .reelprice{font-size:16px;font-weight:900;margin-top:6px}.reelcommerce{position:absolute;left:16px;right:16px;bottom:22px;z-index:84;display:grid;grid-template-columns:1fr auto;gap:8px}.reelproduct{height:56px;border-radius:15px;background:rgba(255,255,255,.96);display:flex;align-items:center;gap:9px;padding:7px 10px;min-width:0}.reelproduct img{width:42px;height:42px;border-radius:10px;object-fit:cover}.reelproduct div{min-width:0}.reelproduct b{font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reelproduct small{font-size:9px;color:#747A85}.reeladd{height:56px;border:0;border-radius:15px;background:#FFE500;color:#002B84;padding:0 17px;font-size:11px;font-weight:950;box-shadow:0 5px 16px rgba(0,0,0,.18)}.reelside{position:absolute;right:14px;bottom:102px;z-index:84;display:grid;gap:11px}.reelside button{width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.46);color:#fff;font-size:15px}.reelhint{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:84;color:rgba(255,255,255,.78);font-size:9px;background:rgba(0,0,0,.34);padding:6px 9px;border-radius:999px;pointer-events:none}.minuteshero{margin:12px 15px 0;border-radius:20px;padding:17px;background:linear-gradient(135deg,#5C1024,#8E1E3D);color:#fff;box-shadow:var(--shadow)}.minuteshero small{font-size:9px;color:#F1C6D2;text-transform:uppercase;font-weight:900;letter-spacing:.09em}.minuteshero h2{font-size:22px;margin:4px 0}.minuteshero p{font-size:10.3px;line-height:1.4;margin:0;color:#F7DDE4}.minutesgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:13px 15px 0}.minprod{background:#fff;border:1px solid #ECEEF2;border-radius:17px;padding:11px;min-height:154px;position:relative}.minprod .emoji{height:64px;border-radius:14px;background:#F6F7FA;display:grid;place-items:center;font-size:37px}.minprod b{font-size:11.5px;display:block;margin-top:8px}.minprod small{font-size:9px;color:var(--muted);display:block;margin-top:2px}.minprod .mprice{font-size:12px;font-weight:900;margin-top:8px}.minprod .madd{position:absolute;right:9px;bottom:9px;height:32px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;padding:0 10px;font-size:9px;font-weight:900}

/* ===== V16: order-pattern delivery choices + model economics ===== */
.foodcartbar{
  position:absolute;left:12px;right:12px;bottom:86px;z-index:49;
  min-height:56px;border-radius:16px;background:#111318;color:#fff;
  display:none;align-items:center;gap:10px;padding:9px 10px 9px 13px;
  box-shadow:0 12px 28px rgba(0,0,0,.25)
}
.foodcartbar.on{display:flex}
.foodcartbar .grow{flex:1;min-width:0}

  <div class="pstep"><div class="ico">🍽</div><b>Mix meals</b><small>Across partners</small></div>
  <div class="pstep"><div class="ico">◷</div><b>Pick time</b><small>Any slot</small></div>
 </div>
 <div class="planner-config">
   <div class="planlength-box">
     <div class="planlength-copy"><b>Plan length</b><small>Start at 3 days · add as many as you need</small></div>
     <div class="daystepper">
       <button onclick="plannerRemoveDay()" ${S.plannerDays<=3?"disabled":""}>−</button>

function plannerAddDay(){
 S.plannerDays+=1;
 render();
 requestAnimationFrame(()=>{screen.scrollTop=screen.scrollHeight});
}
function plannerRemoveDay(){
 if(S.plannerDays<=3){toastMsg("Planner requires at least 3 days");return}
 const lastDay=S.plannerDays-1;
 const keys=Object.keys(S.plannerMeals).filter(k=>S.plannerMeals[k].day===lastDay);
 if(keys.length){
   openSheet(`<h3>Remove Day ${S.plannerDays}?</h3><p>This day already has ${keys.length} planned meal${keys.length>1?"s":""}. Remove the day and those meals?</p>
    <button class="primary" onclick="plannerRemoveDayConfirm(${lastDay})">Remove day</button>
    <button class="secondary" onclick="closeSheet()">Keep it</button>`);
   return;
 }
 S.plannerDays-=1;render();
}
function plannerRemoveDayConfirm(lastDay){
 Object.keys(S.plannerMeals).forEach(k=>{if(S.plannerMeals[k].day===lastDay)delete S.plannerMeals[k]});
 S.plannerDays-=1;closeSheet();render();toastMsg("Last day removed");
}
function walletWidget(){
 return `<div class="walletcard" onclick="go('wallet')"><div class="walleticon">₹</div><div class="grow"><b>Crave Wallet</b><div class="bal">${money(S.wallet)}</div><small>Planner + Tiffin wallet · also usable on normal food orders</small></div><button>Open</button></div>`;
}
function plannerDay(day){
 const meals=Object.entries(S.plannerMeals).filter(([k,v])=>v.day===day).map(([k,v])=>({...v,key:k}));
 return `<div class="flexday"><div class="flexdayhead"><b>Day ${day+1}</b><button onclick="plannerAddMeal(${day})">+ Add meal</button></div>
 ${meals.length?meals.map(m=>plannedMealRow(m)).join(""):`<div class="empty-meal"><div class="pic">＋</div><div><b>No meal yet</b><small>Tap “Add meal” · choose food + time</small></div></div>`}</div>`;
}
function plannedMealRow(m){
 const it=item(m.itemId),r=rest(it.r);
 return `<div class="plannedmeal"><img src="${it.img}" alt=""><div class="grow"><b>${m.time} · ${it.n}</b><small>${r.n} · ${money(it.p)} · ${m.paidWallet?`paid from Wallet`:`regular payment`}</small></div><button onclick="plannerCancel('${m.key}')">Cancel</button></div>`;
}
function plannerAddMeal(day){
 const options=PLANNER_PARTNERS.flatMap(rid=>{const r=rest(rid);return r.items.slice(0,2).map(i=>({id:i[0],name:i[1],price:i[2],img:i[3],r:r.id}))});
 openSheet(`<h3>Day ${day+1} · Add meal</h3><p>Choose time → choose meal.</p>
  <input id="plannerTime" class="timepick" type="time">
  <div class="planner-meals">${options.map(o=>`<div class="planner-option"><img class="food" src="${o.img}" alt=""><div class="grow"><b>${o.name}</b><small>${rest(o.r).n} · ${money(o.price)}</small></div><button onclick="plannerChooseMeal(${day},'${o.id}')">Choose</button></div>`).join("")}</div>`);
}
function plannerChooseMeal(day,itemId){
 const time=(document.getElementById("plannerTime")||{}).value;
 if(!time){toastMsg("Choose a meal time first");return}
 const it=item(itemId);
 openSheet(`<h3>${it.n}</h3><p>Day ${day+1} · ${time} · ${rest(it.r).n}</p>
  <div class="wallet-use"><div class="walleticon" style="width:34px;height:34px;font-size:14px">₹</div><div class="grow"><b>Crave Wallet · ${money(S.wallet)}</b><small>Wallet or regular payment.</small></div></div>
  <button class="primary" onclick="plannerConfirm(${day},'${itemId}','${time}',true)">Pay ${money(it.p)} from Wallet</button>
  <button class="secondary" onclick="plannerConfirm(${day},'${itemId}','${time}',false)">Use regular payment</button>`);
}
function plannerConfirm(day,itemId,time,useWallet){
 const it=item(itemId);
 if(useWallet&&S.wallet<it.p){toastMsg("Wallet balance is lower than this meal");return}
 if(useWallet)S.wallet-=it.p;
 const key="P"+Date.now();
 S.plannerMeals[key]={day:day,time:time,itemId:itemId,paidWallet:useWallet};
 closeSheet();render();toastMsg("Meal planned for Day "+(day+1));
}
function plannerCancel(key){
 const m=S.plannerMeals[key],it=item(m.itemId);
 openSheet(`<h3>Cancel planned meal?</h3><p>Cancel more than 24 hours before the scheduled meal for a full refund. Inside 24 hours, the restaurant policy applies.</p>
  ${m.paidWallet?`<button class="primary" onclick="plannerCancelConfirm('${key}',${it.p})">Cancel before cut-off · refund ${money(it.p)} to Wallet</button>`:`<button class="primary" onclick="plannerCancelConfirm('${key}',0)">Cancel meal</button>`}
  <button class="secondary" onclick="closeSheet()">Keep meal</button>`);
}
function plannerCancelConfirm(key,refund){
 if(refund)S.wallet+=refund;
 delete S.plannerMeals[key];closeSheet();render();toastMsg(refund?"Cancelled · refund added to Crave Wallet":"Meal cancelled");
}

function searchSheet(){openSheet(`<h3>Search Crave</h3><input id="q" placeholder="Try burger, biryani, coffee…" oninput="searchNow(this.value)" style="width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 11px;margin-top:10px"><div id="results"></div>`)}
function searchNow(v){
 v=v.toLowerCase().trim();
 const results=document.getElementById("results");
 if(!v){results.innerHTML="";return}
 const rr=R.filter(r=>(r.n+" "+r.c).toLowerCase().includes(v)).slice(0,6);
 results.innerHTML=rr.map(r=>`<button class="secondary" onclick="closeSheet();openRest('${r.id}')">${r.n} · ${r.a}</button>`).join("");
}

function foodCartCount(){return Object.values(S.foodCart).reduce((a,b)=>a+b,0)}
function foodCartSubtotal(){return Object.entries(S.foodCart).reduce((sum,[id,q])=>sum+(item(id)?.p||0)*q,0)}
function foodCartAllBites(){const ids=Object.keys(S.foodCart);return ids.length>0&&ids.every(id=>item(id)?.bite)}
function addFoodCart(id){
 const it=item(id),r=rest(it.r);
 if(S.foodRest&&S.foodRest!==r.id){
   S.foodCart={};S.delivery="eco";
   toastMsg("Started a new cart for "+r.n);
 }
 S.foodRest=r.id;
 S.foodCart[id]=(S.foodCart[id]||0)+1;
 if(S.mode==="bites"&&foodCartAllBites())S.delivery="bites";
 renderFoodCartBar();
 toastMsg(it.n+" added");
}
function renderFoodCartBar(){
 const n=foodCartCount(),bar=document.getElementById("foodcartbar");
 if(!bar)return;
 bar.classList.toggle("on",n>0);
 if(n){
   document.getElementById("foodcarttitle").textContent=n+" item"+(n>1?"s":"")+" · "+money(foodCartSubtotal());
   document.getElementById("foodcartsub").textContent=(S.foodRest?rest(S.foodRest).n:"Crave")+" · choose delivery";
 }
}
function deliveryChoices(pattern="impulse"){
 const choices=pattern==="scheduled"?[DELIVERY.scheduled,DELIVERY.standard]:[DELIVERY.eco,DELIVERY.standard];
 if(pattern==="impulse"&&foodCartAllBites())choices.push(DELIVERY.bites);
 return choices;
}

 return `<div class="delivery-option ${S.delivery===d.id?"on":""}" onclick="S.delivery='${d.id}';openFoodCart()">

 </div>`;
}

   ${[DELIVERY.eco,DELIVERY.scheduled,DELIVERY.standard,DELIVERY.bites].map(d=>`<div class="econrow"><span>${d.name}</span><span>${d.batch.toFixed(1)}x</span><span>${money(d.cost)}</span><span class="${d.margin<0?"neg":"pos"}">${d.margin<0?"−":"+"}${money(Math.abs(d.margin))}</span></div>`).join("")}

function openFoodCart(){
 const ids=Object.keys(S.foodCart);
 if(!ids.length){toastMsg("Your food cart is empty");return}
 if(!deliveryChoices("impulse").some(d=>d.id===S.delivery))S.delivery="eco";
 const d=DELIVERY[S.delivery],subtotal=foodCartSubtotal(),earn=Math.min(40,subtotal*.04);
 openSheet(`<h3>${rest(S.foodRest).n}</h3><p>${ids.map(id=>item(id).n+" × "+S.foodCart[id]).join(" · ")}</p>
   <div class="delivery-title"><b>Choose delivery</b><button onclick="toggleEcon()">ⓘ Model economics</button></div>
   <div class="delivery-grid">${deliveryChoices("impulse").map(deliveryCard).join("")}</div>
   <div id="econwrap" style="display:none">${economicsPanel()}</div>
   <div class="wallet-use"><div class="walleticon" style="width:34px;height:34px;font-size:14px">₹</div><div class="grow"><b>Crave Wallet · ${money(S.wallet)}</b><small>Planner/Tiffin balance and refunds can be used on normal Crave food orders.</small></div><button onclick="S.useWallet=!S.useWallet;openFoodCart()">${S.useWallet?"Applied":"Use"}</button></div>
   <div class="coins-checkout"><b>Earn ~${Math.round(earn)} SuperCoins</b><small>4% on food, capped at 40 SC/order. Redemption can cover up to 20% of a food order when balance ≥20 SC.</small></div>
   ${(()=>{const gross=subtotal+d.fee,walletUse=S.useWallet?Math.min(S.wallet,gross):0;return `<div class="order-summary"><div class="line"><span>Food subtotal</span><span>${money(subtotal)}</span></div><div class="line"><span>${d.name} delivery</span><span>${money(d.fee)}</span></div>${walletUse?`<div class="line"><span>Crave Wallet</span><span>−${money(walletUse)}</span></div>`:""}<div class="line total"><span>Pay now</span><span>${money(gross-walletUse)}</span></div></div>`})()}
   <button class="primary" onclick="placeFoodOrder()">Place order</button><button class="secondary" onclick="closeSheet()">Keep browsing</button>`);
}
function toggleEcon(){const x=document.getElementById("econwrap");if(x)x.style.display=x.style.display==="none"?"block":"none"}
function placeFoodOrder(){
 const n=foodCartCount(),d=DELIVERY[S.delivery],earned=Math.min(40,foodCartSubtotal()*.04),gross=foodCartSubtotal()+d.fee;
 const walletUse=S.useWallet?Math.min(S.wallet,gross):0;
 S.wallet-=walletUse;S.useWallet=false;S.coins+=Math.round(earned);S.foodCart={};S.foodRest=null;S.delivery="eco";closeSheet();renderFoodCartBar();toastMsg(n+" item(s) ordered · "+d.name+" selected");
}
function scheduledDeliverySheet(label,onConfirm){
 S.delivery="scheduled";
 openSheet(`<h3>${label}</h3><p>Scheduled orders use denser batching by default. You can upgrade delivery if you prefer.</p>
   <div class="delivery-grid">${deliveryChoices("scheduled").map(deliveryCard).join("")}</div>
   <div class="delivery-title"><b>Order-pattern economics</b><button onclick="toggleEcon()">ⓘ View</button></div>
   <div id="econwrap" style="display:none">${economicsPanel()}</div>
   <button class="primary" onclick="${onConfirm}">Confirm · ${money(DELIVERY[S.delivery].fee)} delivery</button><button class="secondary" onclick="closeSheet()">Back</button>`);
}

function cartCount(){return Object.values(S.cart).reduce((a,b)=>a+b,0)}
function addCart(id,name){
 S.cart[id]=(S.cart[id]||0)+1;
 toastMsg(name+" added · Cart "+cartCount());
 const cc=document.querySelectorAll(".cartmini");cc.forEach(x=>x.textContent="Cart · "+cartCount());
}
function reelSlide(x,idx){
 const r=rest(x.r),it=item(x.i);
 return `<section class="reelpage" data-reel="${idx}">
   <video src="${x.vid}" muted loop playsinline preload="metadata" poster="${it.img}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"></video>
   <img class="reelfallback" src="${it.img}" alt="${x.title}" style="display:none">
   <div class="reelgrad"></div>
   <div class="reelhint">Swipe up for next reel</div>
   <div class="reeltop"><span>Crave Reels</span><span class="cartmini">Cart · ${cartCount()}</span></div>
   <div class="reelside"><button onclick="event.stopPropagation();toastMsg('Saved')">♡</button><button onclick="event.stopPropagation();toastMsg('Share link copied')">↗</button></div>
   <div class="reelinfo"><div class="reelbrand"><img src="${r.logo}" alt="${r.n}" onerror="this.style.visibility='hidden'"><span>${r.n}${it.bite?' · Bites':''}</span></div><h3>${x.title}</h3><div class="reelprice">${money(it.p)}</div><div style="font-size:8px;color:rgba(255,255,255,.58);margin-top:5px">${x.credit}</div></div>
   <div class="reelcommerce"><div class="reelproduct"><img src="${it.img}" alt=""><div><b>${it.n}</b><small>${r.n}</small></div></div><button class="reeladd" onclick="event.stopPropagation();addFoodCart('${it.id}')">Add · ${money(it.p)}</button></div>
 </section>`;
}
function openReel(i){
 playerbody.innerHTML=`<div id="reelfeed" class="reelfeed">${REELS.map(reelSlide).join("")}</div>`;
 player.classList.add("on");
 requestAnimationFrame(()=>{
   const feed=document.getElementById("reelfeed"),slides=[...feed.querySelectorAll(".reelpage")],videos=[...feed.querySelectorAll("video")];
   if(slides[i])slides[i].scrollIntoView({block:"start"});
   const io=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        const v=e.target.querySelector("video");
        if(!v)return;
        if(e.isIntersecting&&e.intersectionRatio>.65){videos.forEach(z=>{if(z!==v)z.pause()});v.play().catch(()=>{});}
        else v.pause();
      });
   },{root:feed,threshold:[.25,.65,.9]});
   slides.forEach(s=>io.observe(s));
   window._reelObserver=io;
 });
}
function closeReel(){
 if(window._reelObserver){window._reelObserver.disconnect();window._reelObserver=null}
 player.querySelectorAll("video").forEach(v=>v.pause());
 player.classList.remove("on");playerbody.innerHTML="";
}
function openSheet(h){sheetbody.innerHTML=h;sheetbg.classList.add("on");sheet.classList.add("on")}
function closeSheet(){sheetbg.classList.remove("on");sheet.classList.remove("on")}
function toastMsg(m){toast.textContent=m;toast.classList.add("on");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("on"),1500)}
function nav(){
 const ico={
  home:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10.5 12 4l7 6.5"></path><path d="M7.5 9.5V19h9V9.5"></path></svg>`,
  bites:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h6.8a3.2 3.2 0 1 1 0 6.4H7z"></path><path d="M7 11.4h8a3.3 3.3 0 1 1 0 6.6H7z"></path><path d="M7 5v13"></path></svg>`,
  orders:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12v14H6z"></path><path d="M9 9h6"></path><path d="M9 12h6"></path><path d="M9 15h4"></path></svg>`,
  account:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 19a6.5 6.5 0 0 1 13 0"></path></svg>`
 };
 bottom.innerHTML=`
 <button class="nav ${S.page==="home"?"on":""}" onclick="go('home')"><span class="ico">${ico.home}</span><span>Home</span></button>
 <button class="nav ${S.page==="bites"?"on":""}" onclick="go('bites')"><span class="ico">${ico.bites}</span><span>Bites</span></button>
 <button class="nav reelsnav" onclick="openReel(0)"><span class="orb"></span><span>Reels</span></button>
 <button class="nav ${S.page==="orders"?"on":""}" onclick="go('orders')"><span class="ico">${ico.orders}</span><span>Orders</span></button>
 <button class="nav ${S.page==="account"||S.page==="passes"||S.page==="wallet"?"on":""}" onclick="go('account')"><span class="ico">${ico.account}</span><span>Account</span></button>`;
}
function initPromo(){
 clearInterval(window._promo);
 const rail=document.getElementById("promorail"),dots=document.getElementById("dots");
 if(!rail||!dots)return;
 const cards=[...rail.children];let idx=0;
 const paint=()=>[...dots.children].forEach((d,i)=>d.classList.toggle("on",i===idx));
 window._promo=setInterval(()=>{
   idx=(idx+1)%cards.length;
   rail.scrollTo({left:cards[idx].offsetLeft-15,behavior:"smooth"});
   paint();
 },3900);
 rail.addEventListener("scroll",()=>{
   const mid=rail.scrollLeft+rail.clientWidth/2;let best=0,dist=Infinity;
   cards.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<dist){dist=d;best=i}});
   idx=best;paint();
 },{passive:true});
}

function render(){
 if(S.page==="home")screen.innerHTML=home();
 else if(S.page==="bites")screen.innerHTML=bites();
 else if(S.page==="restaurant")screen.innerHTML=restaurant();
 else if(S.page==="planner")screen.innerHTML=planner();
 else if(S.page==="tiffin")screen.innerHTML=tiffin();
 else if(S.page==="minutes")screen.innerHTML=minutes();
 else if(S.page==="rewards")screen.innerHTML=rewards();
 else if(S.page==="orders")screen.innerHTML=orders();
 else if(S.page==="account")screen.innerHTML=account();
 else if(S.page==="passes")screen.innerHTML=passes();
 else if(S.page==="wallet")screen.innerHTML=walletPage();
 nav();renderFoodCartBar();requestAnimationFrame(initPromo);
}
const screen=document.getElementById("screen"),bottom=document.getElementById("bottom"),sheetbg=document.getElementById("sheetbg"),sheet=document.getElementById("sheet"),sheetbody=document.getElementById("sheetbody"),player=document.getElementById("player"),playerbody=document.getElementById("playerbody"),toast=document.getElementById("toast");
render();
</script>
</body>
</html>
